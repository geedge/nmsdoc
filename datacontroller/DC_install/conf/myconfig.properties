#---SNMP-------
##--SNMP 目标主机信息 获取端口
snmp.client.port = 161
##--SNMP 接收告警 监听端口
snmp.trap.port = 162
##--SNMP 主动告警 接收端口
snmp.community = public
##--ObjectSNMP class文件打包名称（不可修改）
snmp.class.package = osDomains
##--SNMP 加密认证级别 0 不认证 不加密'zg' 1 认证 不加密'hckings' ,2认证 且 加密'dxy'
snmp.v3.security.level = 0
##--SNMP 加密认证用户 用户名
snmp.v3.security.name = zg
##--SNMP 认证协议方式
